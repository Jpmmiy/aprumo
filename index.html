<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aprumo</title>
    <meta name="description" content="Aprumo — o painel de estudos de João Pedro Terra Mainardi. Cronômetro, horas por matéria, questões, redação e rotina do cursinho." />

    <link rel="icon" type="image/svg+xml" href="/icones/prumo.svg" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#10150E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EDF0E6" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aprumo" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica o tema antes da primeira pintura, para não piscar branco no escuro.
      (function () {
        try {
          var t = localStorage.getItem('aprumo:tema')
          if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
